<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TG Store — Звёзды, Premium и Подарки</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-active: #27354f;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .currency-switch { display: flex; background: var(--card); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
    .currency-btn { background: none; border: none; color: var(--muted); padding: 6px 10px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .currency-btn.active { background: var(--accent); color: #0f172a; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
    .tab { flex: 1; text-align: center; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; cursor: pointer; transition: 0.15s; display: flex; flex-direction: column; justify-content: space-between; }
    .item.selected { border-color: var(--accent); background: var(--card-active); box-shadow: 0 0 0 1px var(--accent); }
    .item-icon { font-size: 26px; margin-bottom: 8px; }
    .item-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .item-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .item-price { font-size: 16px; font-weight: 700; color: var(--accent); }

    .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .section-title { font-size: 14px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    .input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 15px; outline: none; }
    .input:focus { border-color: var(--accent); }

    .wallets { display: flex; gap: 8px; margin-bottom: 12px; }
    .wallet-btn { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
    .wallet-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    .requisites-box { background: var(--bg); border: 1px dashed var(--border); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .req-number { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .copy-btn { background: var(--card); border: 1px solid var(--border); color: var(--accent); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

    .buy-btn { width: 100%; background: var(--accent); color: #0f172a; border: none; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .buy-btn:active { background: var(--accent-dark); }
    .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 TG Магазин</h1>
    <div class="currency-switch">
      <button class="currency-btn active" onclick="setCurrency('TJS', this)">TJS</button>
      <button class="currency-btn" onclick="setCurrency('RUB', this)">RUB</button>
      <button class="currency-btn" onclick="setCurrency('USD', this)">USD</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="setCategory('stars', this)">⭐️ Звёзды</div>
    <div class="tab" onclick="setCategory('premium', this)">🚀 Premium</div>
    <div class="tab" onclick="setCategory('gifts', this)">🎁 Подарки</div>
  </div>

  <div class="grid" id="products-grid"></div>

  <div class="section">
    <div class="section-title">1. Куда отправить покупку?</div>
    <input type="text" id="username-input" class="input" placeholder="Введите ваш @username в Telegram" />
  </div>

  <div class="section">
    <div class="section-title">2. Выберите кошелёк для перевода</div>
    <div class="wallets">
      <button class="wallet-btn active" onclick="setWallet('dc', this)">Душанбе Сити</button>
      <button class="wallet-btn" onclick="setWallet('alif', this)">Алиф</button>
      <button class="wallet-btn" onclick="setWallet('visa', this)">Visa</button>
    </div>
    <div class="requisites-box">
      <div>
        <div style="font-size: 11px; color: var(--muted); margin-bottom: 2px;" id="wallet-label">Душанбе Сити (нажмите скопировать):</div>
        <div class="req-number" id="wallet-number"></div>
      </div>
      <button class="copy-btn" id="copy-btn" onclick="copyRequisites()">Копировать</button>
    </div>
  </div>

  <button class="buy-btn" onclick="submitOrder()">Я оплатил — отправить чек</button>
  <div class="note">После нажатия откроется чат с @ilikemoney777 с готовым заказом. Прикрепите скриншот чека для выдачи.</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const WALLETS = {
      dc:   { name: 'Душанбе Сити', number: '+992029093838' },
      alif: { name: 'Алиф',         number: '+992029093838' },
      visa: { name: 'Карта Visa',   number: '4439200023951147' }
    };

    const SELLER_USERNAME = 'ilikemoney777';

    const PRODUCTS = {
      stars: [
        { id: 's50',   icon: '⭐️', title: '50 Звёзд',    sub: 'Моментально', prices: { TJS: 9.5, RUB: 85,   USD: 0.9 } },
        { id: 's100',  icon: '⭐️', title: '100 Звёзд',   sub: 'Популярное',  prices: { TJS: 19,  RUB: 170,  USD: 1.8 } },
        { id: 's250',  icon: '🌟', title: '250 Звёзд',   sub: 'Выгодно',     prices: { TJS: 47.5, RUB: 420, USD: 4.5 } },
        { id: 's500',  icon: '🌟', title: '500 Звёзд',   sub: 'Хит продаж',  prices: { TJS: 95,  RUB: 840,  USD: 9.0 } },
        { id: 's1000', icon: '💫', title: '1000 Звёзд',  sub: 'Максимум',    prices: { TJS: 190, RUB: 1680, USD: 18.0 } }
      ],
      premium: [
        { id: 'p1',  icon: '🚀', title: 'Premium 1 мес.',  sub: 'Без входа в аккаунт', prices: { TJS: 45,  RUB: 380,  USD: 4.2 } },
        { id: 'p3',  icon: '🚀', title: 'Premium 3 мес.',  sub: 'Подарком по @юз',     prices: { TJS: 130, RUB: 1100, USD: 12.0 } },
        { id: 'p6',  icon: '👑', title: 'Premium 6 мес.',  sub: 'Подарком по @юз',     prices: { TJS: 190, RUB: 1600, USD: 17.5 } },
        { id: 'p12', icon: '👑', title: 'Premium 12 мес.', sub: 'Самый выгодный',      prices: { TJS: 340, RUB: 2900, USD: 31.0 } }
      ],
      gifts: [
        { id: 'g15',  icon: '🧸', title: 'Мишка / Сердце', sub: 'Подарок 15 ⭐️',  prices: { TJS: 4,  RUB: 35,  USD: 0.4 } },
        { id: 'g25',  icon: '🌹', title: 'Роза / Подарок', sub: 'Подарок 25 ⭐️',  prices: { TJS: 6,  RUB: 55,  USD: 0.6 } },
        { id: 'g50',  icon: '🎂', title: 'Торт / Букет',   sub: 'Подарок 50 ⭐️',  prices: { TJS: 11, RUB: 95,  USD: 1.0 } },
        { id: 'g100', icon: '💎', title: 'Алмаз / Кубок',  sub: 'Подарок 100 ⭐️', prices: { TJS: 19, RUB: 170, USD: 1.8 } }
      ]
    };

    const SYMBOLS = { TJS: 'сомони', RUB: '₽', USD: '$' };

    let currentCurrency = 'TJS';
    let currentCategory = 'stars';
    let selectedProduct = PRODUCTS.stars[0];
    let currentWallet = 'dc';

    if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username) {
      document.getElementById('username-input').value = '@' + tg.initDataUnsafe.user.username;
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';
      PRODUCTS[currentCategory].forEach(item => {
        const div = document.createElement('div');
        div.className = 'item' + (selectedProduct.id === item.id ? ' selected' : '');
        div.onclick = () => { selectedProduct = item; renderProducts(); };
        const priceVal = item.prices[currentCurrency];
        const priceText = currentCurrency === 'USD' ? `$${priceVal}` : `${priceVal} ${SYMBOLS[currentCurrency]}`;
        div.innerHTML = `
          <div>
            <div class="item-icon">${item.icon}</div>
            <div class="item-title">${item.title}</div>
            <div class="item-sub">${item.sub}</div>
          </div>
          <div class="item-price">${priceText}</div>
        `;
        grid.appendChild(div);
      });
    }

    function setCurrency(curr, btn) {
      currentCurrency = curr;
      document.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      selectedProduct = PRODUCTS[cat][0];
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function setWallet(key, btn) {
      currentWallet = key;
